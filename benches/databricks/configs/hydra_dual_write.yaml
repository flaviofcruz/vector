# Hydra candidate for `check --sink s3 --sink zerobus`: remote write -> metric_to_log_hydra ->
# aws_s3 (fake-s3) and databricks_zerobus (fake-zerobus), in one Vector process.
# Sinks mirror staging VAM's diskless_logs_metric_to_log_json and
# lumberjack_prime_hydra_sink_pod_prime, except:
#   - endpoints point at the local fakes, and credentials are dummies;
#   - S3 batch timeout 5s (prod 90s) so objects appear quickly;
#   - buffers block instead of dropping, so a slow fake loses nothing.
# Every DATABRICKS_BENCH_* variable below is set by `check` (see check.rs). Use exactly these two
# sinks with `--sink s3 --sink zerobus`; a config that reads a variable `check` did not set fails
# to load.
data_dir: "${DATABRICKS_BENCH_DATA_DIR}"

sources:
  prom_remote_write:
    type: prometheus_remote_write
    address: "${DATABRICKS_BENCH_SOURCE_ADDR}"
    metadata_conflict_strategy: ignore
    group_metrics: false
    acknowledgements:
      enabled: false

transforms:
  log_based_metric_hydra_transformed:
    type: metric_to_log_hydra
    inputs: [prom_remote_write]

sinks:
  s3_metric_to_log_json:
    type: aws_s3
    inputs: [log_based_metric_hydra_transformed]
    endpoint: "${DATABRICKS_BENCH_S3_ENDPOINT}"
    force_path_style: true
    region: us-west-2
    bucket: databricks-bench
    key_prefix: "metric-to-log-json/date=%F/vector-aggregator-lumberjack-"
    filename_time_format: "%F-%s"
    filename_extension: json.zst
    compression: zstd
    encoding:
      codec: json
    framing:
      method: newline_delimited
    batch:
      max_bytes: 314572800
      timeout_secs: 5
    request:
      concurrency: 32
      retry_attempts: 1
      retry_max_duration_secs: 60
      timeout_secs: 30
    healthcheck:
      enabled: false
    acknowledgements:
      enabled: false
    buffer:
      type: memory
      max_events: 500000
      when_full: block

  zerobus_pod_prime:
    type: databricks_zerobus
    inputs: [log_based_metric_hydra_transformed]
    ingestion_endpoint: "${DATABRICKS_BENCH_ZEROBUS_INGEST_ENDPOINT}"
    unity_catalog_endpoint: "${DATABRICKS_BENCH_ZEROBUS_UC_ENDPOINT}"
    table_name: "${DATABRICKS_BENCH_ZEROBUS_TABLE}"
    auth:
      strategy: oauth
      client_id: databricks-bench
      client_secret: databricks-bench
    user_agent: Hydra
    batch_encoding:
      codec: arrow_stream
    stream_options:
      compression: zstd
    recover_from_schema_rejection: true
    healthcheck:
      enabled: false
    acknowledgements:
      enabled: false
    buffer:
      type: memory
      max_events: 500000
      when_full: block
