# Hydra candidate for `check --sink azure_blob`: remote write -> metric_to_log_hydra -> azure_blob
# (fake-azure-blob), in one Vector process. Staging Azure VAM writes only blob sinks (no Zerobus).
# The sink mirrors staging westus VAM's diskless_logs_metric_to_log_json, except:
#   - the connection string's BlobEndpoint points at the local fake (path-style, `/<account>`),
#     and its SAS token is a dummy;
#   - batch timeout 5s (prod 90s) so blobs appear quickly;
#   - the buffer blocks instead of dropping, so a slow fake loses nothing.
# Every DATABRICKS_BENCH_* variable below is set by `check`. The candidate needs a Vector built
# with the `sinks-azure_blob` feature.
data_dir: "${DATABRICKS_BENCH_DATA_DIR}"

sources:
  prom_remote_write:
    type: prometheus_remote_write
    address: "${DATABRICKS_BENCH_SOURCE_ADDR}"
    metadata_conflict_strategy: ignore
    group_metrics: false
    acknowledgements:
      enabled: false

transforms:
  log_based_metric_hydra_transformed:
    type: metric_to_log_hydra
    inputs: [prom_remote_write]

sinks:
  azure_blob_metric_to_log_json:
    type: azure_blob
    inputs: [log_based_metric_hydra_transformed]
    connection_string: "AccountName=databricksbench;BlobEndpoint=${DATABRICKS_BENCH_AZURE_BLOB_ENDPOINT}/databricksbench;SharedAccessSignature=sv=2022-11-02&sig=databricks-bench"
    storage_account: databricksbench
    container_name: databricks-bench
    blob_prefix: "metric-to-log-json/date=%F/vector-aggregator-lumberjack-"
    blob_time_format: "%F-%s"
    compression: zstd
    encoding:
      codec: json
    framing:
      method: newline_delimited
    batch:
      max_bytes: 314572800
      timeout_secs: 5
    request:
      concurrency: 32
      retry_attempts: 1
      retry_max_duration_secs: 60
      timeout_secs: 30
    healthcheck:
      enabled: false
    acknowledgements:
      enabled: false
    buffer:
      type: memory
      max_events: 500000
      when_full: block
