# Workflow from upstream: Never ran
# Only kept to reduce conflicts while syncing from upstream.

name: Test Make Command - Linux

permissions:
  contents: read

jobs:
  run-make-command:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup
        with:
          rust: true
          protoc: true
          libsasl2: true
      - run: make ${{ inputs.command }}
