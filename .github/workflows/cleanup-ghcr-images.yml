# Workflow from upstream: Never ran
# Only kept to reduce conflicts while syncing from upstream.

name: Cleanup Untagged GHCR Images

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Delete untagged vector images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: vector
          package-type: container
          min-versions-to-keep: 0
          delete-only-untagged-versions: true
        continue-on-error: true

      - name: Delete old vector-test-runner images
        uses: actions/delete-package-versions@e5bc658cc4c965c472efe991f8beea3981499c55 # v5.0.0
        with:
          package-name: test-runner
          package-type: container
          min-versions-to-keep: 5
          num-old-versions-to-delete: 50
