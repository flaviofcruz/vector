name: "BLOCKING: Databricks Changelog Check"

on:
  pull_request:
    branches:
      - v*-custom
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read

jobs:
  check-db-changelog:
    runs-on:
      group: databricks-emu-protected-runner-group-small
      labels: linux-ubuntu-latest-2core-8gb
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Test changelog validator
        run: python3 -m unittest scripts/tests/test_check_databricks_changelog.py

      - name: Validate Databricks changelog
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: >-
          python3 scripts/check_databricks_changelog.py
          --base-ref "${BASE_REF}"
          --head-ref HEAD
          --repository "${REPOSITORY}"
          --pr-number "${PR_NUMBER}"
