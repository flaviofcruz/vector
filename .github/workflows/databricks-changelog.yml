name: "BLOCKING: Databricks Changelog Check"

on:
  pull_request:
    branches:
      - v*-custom
    types:
      - opened
      - edited
      - synchronize

permissions:
  contents: read

jobs:
  check-db-changelog:
    runs-on:
      group: databricks-emu-protected-runner-group-small
      labels: linux-ubuntu-latest-2core-8gb
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch origin "${BASE_REF}:${BASE_REF}"

      - name: Check Changed files
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          CHANGED_FILES=$(git diff --name-only "${BASE_REF}" HEAD -- | grep 'README.databricks.md' || true)
          if [ -z "$CHANGED_FILES" ]; then
            echo "Code changes have been made, but no README.databricks.md changes have been made. Please add a changelog entry to README.databricks.md."
            exit 1
          fi
