name: "BLOCKING: Build and Unit Test"

on:
  pull_request:
    branches: 
      - v*-custom
  workflow_dispatch:    

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build-and-unit-test:
    name: Build and Unit Test
    runs-on: 
      # Use protected runner group with 32 core machines as the regular runner would just OOM
      group: databricks-eng-protected-runner-group-32core
      labels: linux-ubuntu-latest-32core
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          path: vector

      - name: Generate access token for VRL repository
        id: generate-token-gh-app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.VECTOR_VRL_GH_APP_ID }}
          private-key: ${{ secrets.VECTOR_VRL_GH_PRIVATE_KEY }}
          owner: databricks-eng
          repositories: vrl

      - name: Checkout VRL repository
        uses: actions/checkout@v5
        with:
          repository: databricks-eng/vrl
          ref: v0.30.0-custom
          token: ${{ steps.generate-token-gh-app.outputs.token }}
          persist-credentials: false
          path: vrl

      - name: Install protobuf compiler
        uses: arduino/setup-protoc@v3
        with:
          # Pass the token to avoid rate limiting as per the action docs
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsasl2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          
      - name: Configure Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          # Include Cargo.lock in cache key for more precise invalidation
          key: ${{ hashFiles('**/Cargo.lock') }}
          # Cache target directory and registry
          cache-targets: true
          cache-all-crates: true
          workspaces: vector
          cache-on-failure: true

      - name: Run build test
        run: cargo build
        working-directory: vector
      
      - name: Install cargo-nextest
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo-nextest
          locked: true

      - name: Run unit tests
        run: cargo nextest run
        working-directory: vector
