name: "BLOCKING: Build and Unit Test"

on:
  pull_request:
    branches:
      - v*-custom

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Test-only copy of the Universe redaction executor, needed to link the `databricks-redaction` feature.
  DATABRICKS_VECTOR_REDACTOR_LIB_DIR: ${{ github.workspace }}/vector/lib/vector-redaction-executor/tests/fixtures/linux-x86_64
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build-and-unit-test:
    name: Build and Unit Test
    permissions:
      id-token: write # JFrog OIDC auth
      contents: read
    runs-on:
      # Use protected runner group with 32 core machines as the regular runner would just OOM
      group: databricks-emu-protected-runner-group-2xlarge
      labels: linux-ubuntu-latest-32core-128gb
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: vector
          persist-credentials: false

      - name: Verify redaction test fixture
        run: echo "7cb19e9e718c22627bc74d508ac0a3c2c072b6bef79258660e37355c6f72f8a9  vector/lib/vector-redaction-executor/tests/fixtures/linux-x86_64/libvector_redactor.a" | sha256sum --check -

      - name: Set up Rust workspace
        uses: ./vector/.github/actions/setup-rust-workspace
        with:
          vrl-app-id: ${{ secrets.VECTOR_VRL_GH_APP_ID }}
          vrl-private-key: ${{ secrets.VECTOR_VRL_GH_PRIVATE_KEY }}

      - name: Build workspace
        run: cargo build --workspace --all-targets --locked --features databricks-redaction
        working-directory: vector

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.129

      - name: Run unit tests
        run: cargo nextest run --workspace --no-fail-fast --locked --features databricks-redaction
        working-directory: vector

      - name: Run databricks-redaction tests
        run: scripts/test-databricks-redaction.sh
        working-directory: vector
