name: "BLOCKING: Formatting Check"

on:
  pull_request:
    branches:
      - v*-custom
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  check-rust:
    permissions:
      id-token: write # JFrog OIDC auth
      contents: read
    runs-on:
      group: databricks-emu-protected-runner-group-small
      labels: linux-ubuntu-latest-2core-8gb

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          path: vector
          persist-credentials: false

      - name: Set up Rust workspace
        uses: ./vector/.github/actions/setup-rust-workspace
        with:
          vrl-app-id: ${{ secrets.VECTOR_VRL_GH_APP_ID }}
          vrl-private-key: ${{ secrets.VECTOR_VRL_GH_PRIVATE_KEY }}
          components: rustfmt
          cache-targets: 'false'
          native-deps: 'false'

      - name: Run rust fmt check
        run: cargo fmt --all -- --check
        working-directory: vector
