# Workflow from upstream: Never ran
# Only kept to reduce conflicts while syncing from upstream.

name: Update install.sh Suite

permissions:
  contents: read

jobs:
  test-install:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.ref }}

      - run: sudo apt-get install --yes bc
      - run: bash distribution/install.sh -- -y
      - run: ~/.vector/bin/vector --version
