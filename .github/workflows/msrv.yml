# Workflow from upstream: Never ran
# Only kept to reduce conflicts while syncing from upstream.

name: Check minimum supported Rust version (MSRV)

env:
  RUST_BACKTRACE: full
  CI: true
  PROFILE: debug

permissions:
  contents: read

jobs:
  check-msrv:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          ref: ${{ inputs.checkout_ref }}
      - uses: ./.github/actions/setup
        with:
          rust: true
          protoc: true
          libsasl2: true
          cargo-msrv: true
      - run: cargo msrv verify
