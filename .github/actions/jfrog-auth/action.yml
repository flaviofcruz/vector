name: 'JFrog Auth & Cargo Registry Config'
description: 'Authenticate with JFrog via OIDC and configure Cargo to use JFrog registry'
runs:
  using: 'composite'
  steps:
    - name: Get JFrog OIDC token
      shell: bash
      run: |
        set -euo pipefail

        # Get GitHub OIDC ID token
        ID_TOKEN=$(curl -sLS \
          -H "User-Agent: actions/oidc-client" \
          -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jfrog-github" | jq -r .value)
        echo "::add-mask::${ID_TOKEN}"

        # Exchange for JFrog access token
        ACCESS_TOKEN=$(curl -sLS -XPOST -H "Content-Type: application/json" \
          "https://databricks.jfrog.io/access/api/v1/oidc/token" \
          -d "{\"grant_type\": \"urn:ietf:params:oauth:grant-type:token-exchange\", \"subject_token_type\":\"urn:ietf:params:oauth:token-type:id_token\", \"subject_token\": \"${ID_TOKEN}\", \"provider_name\": \"github-actions\"}" | jq -r .access_token)
        echo "::add-mask::${ACCESS_TOKEN}"

        if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
          echo "FAIL: Could not extract JFrog access token"
          exit 1
        fi
        echo "JFROG_ACCESS_TOKEN=${ACCESS_TOKEN}" >> "$GITHUB_ENV"

    - name: Configure Cargo
      shell: bash
      run: |
        set -euo pipefail

        mkdir -p ~/.cargo
        cat > ~/.cargo/config.toml << EOF
        [source.crates-io]
        replace-with = "jfrog"

        [source.jfrog]
        registry = "sparse+https://databricks.jfrog.io/artifactory/api/cargo/db-cargo-remote/index/"

        [registries.jfrog]
        index = "sparse+https://databricks.jfrog.io/artifactory/api/cargo/db-cargo-remote/index/"
        credential-provider = ["cargo:token"]
        EOF

        cat > ~/.cargo/credentials.toml << EOF
        [registries.jfrog]
        token = "Bearer ${JFROG_ACCESS_TOKEN}"
        EOF

        echo "CARGO_REGISTRIES_JFROG_TOKEN=Bearer ${JFROG_ACCESS_TOKEN}" >> "$GITHUB_ENV"

        echo "Cargo configured to use JFrog registry"
