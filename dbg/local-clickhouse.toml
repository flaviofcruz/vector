[sources.demo]
type = "demo_logs"
format = "json"
interval = 0.01

[sinks.clickhouse]
type = "clickhouse"
inputs = ["demo"]
endpoint = "http://cluster-service-write-headless-testing.logging-clickhouse.svc.cluster.local:8123"
