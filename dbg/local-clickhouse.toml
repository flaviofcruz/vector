table = "vector_logs"
database = "default"
format = "json_each_row"
date_time_best_effort = true
skip_unknown_fields = true
auth.strategy = "basic"
auth.user = "vector-aggregator"
auth.password = "3SC6HCVg"


# Enable headless service mode
use_headless_service = true
