[package]
name = "vector-vrl-functions"
version = "0.1.0"
authors = ["Vector Contributors <vector@datadoghq.com>"]
edition = "2024"
publish = false
license = "MPL-2.0"

[dependencies]
indoc.workspace = true
vrl.workspace = true
enrichment = { path = "../../enrichment" }
# lp_unwrap: base64 + wire-format walk against the LogDaemonWrapper / LogEntry descriptors.
base64-simd = "0.8"
bytes.workspace = true
prost-reflect.workspace = true
zstd = { version = "0.13.0", default-features = false }
vector-redaction-executor = { path = "../../vector-redaction-executor", optional = true }
dnstap-parser = { path = "../../dnstap-parser", optional = true }
vector-vrl-metrics = { path = "../../vector-vrl-metrics", optional = true }
serde_json = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
# The `apply_redaction` / resolver tests build a `RedactionPlanSet` to serialize as a plan file.
prost = { workspace = true, features = ["derive"] }
# The `lp_splice_metadata` parity tests decode the encoded message against the fat descriptor and
# build timestamp event values.
prost-reflect.workspace = true
chrono.workspace = true

[features]
default = []
databricks-redaction = [
  "dep:vector-redaction-executor",
  "vector-redaction-executor/static-executor",
  "dep:serde_json",
]
dnstap = ["dep:dnstap-parser"]
vrl-metrics = ["dep:vector-vrl-metrics"]
