[package]
name = "vector-vrl-functions"
version = "0.1.0"
authors = ["Vector Contributors <vector@datadoghq.com>"]
edition = "2024"
publish = false
license = "MPL-2.0"

[dependencies]
indoc.workspace = true
vrl.workspace = true
enrichment = { path = "../../enrichment" }
vector-redaction-executor = { path = "../../vector-redaction-executor" }
dnstap-parser = { path = "../../dnstap-parser", optional = true }
vector-vrl-metrics = { path = "../../vector-vrl-metrics", optional = true }

[dev-dependencies]
# The `apply_redaction` / resolver tests build a `RedactionPlanSet` to serialize as a plan file.
prost = { workspace = true, features = ["derive"] }

[features]
default = []
dnstap = ["dep:dnstap-parser"]
vrl-metrics = ["dep:vector-vrl-metrics"]
