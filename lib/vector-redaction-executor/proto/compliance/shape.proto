  // Auth handler / authenticator class name.
  DATA_SHAPE_AUTH_HANDLER_NAME = 155;
  // Data Rooms embedding cache key.
  DATA_SHAPE_DATA_ROOMS_EMBEDDING_PATH = 156;
  // Notifications-service idempotency key.
  DATA_SHAPE_NOTIFSVC_IDEMPOTENCY_KEY = 157;
  // CPDR asset-sync enum strings.
  DATA_SHAPE_CPDR_ASSET_SYNC_ENUM = 158;
  // The `.name()` of any entity-replication placement proto enum.
  DATA_SHAPE_ENTITY_PLACEMENT_COMMON_TYPES = 159;
  // Frontend ES (engineering system) component id.
