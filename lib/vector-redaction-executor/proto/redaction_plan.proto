syntax = "proto2";

package databricks.logstructuredredactionplan;

// Vendored copy. Two changes from the source: the scalapb import and option block are dropped, and
// the taxonomy import points at the local DataLabel-only stub. Wire format and generated Rust are
// unchanged. Also imports the vendored DataShape enum from compliance/shape.proto for shape
// enforcement in PassThroughString.
//
// TODO(vendored): copy of universe's
// log-sync/structured-logs/common/src/redaction/proto/redaction_plan.proto. When vrl/vector is
// vendored into universe, converge this and the universe original to a single source of truth so the
// contract isn't maintained in two places.
import "compliance/taxonomy.proto";
import "compliance/shape.proto";

option java_package = "com.databricks.log.structured.redaction.streaming.plan.jproto";
option java_outer_classname = "RedactionPlanProto";
option java_generate_equals_and_hash = true;
option java_multiple_files = true;

/*
Language-neutral contract between the Java planner and the Rust executor for the streaming proto
redactor. RedactionPlanBuilder's in-memory MessagePlan graph of pointers can't cross the JVM/Rust
boundary, so it's lowered into this flat table of plans that reference each other by index; the Rust
executor reconstructs the graph and redacts records. Only the planner's inputs are serialized;
whatever MessagePlan.freeze() derives is recomputed by the Rust loader.

  PRODUCER: log-sync/structured-logs/common/src/redaction/streaming/MessagePlanSerializer.java
  CONSUMER: the Rust executor crate (databricks-eng/vector fork).

1:1 with the planner (source of truth for redaction semantics):
  MessageRedactionPlan <- MessagePlan (log-sync/structured-logs/common/src/redaction/streaming/MessagePlan.java)
  FieldAction          <- FieldAction opcodes (log-sync/structured-logs/common/src/redaction/streaming/FieldAction.java)
  RedactionPlanSet     <- serialization wrapper (flat table); no planner equivalent.
*/

// The flat plan table; plans reference each other by index (see Recurse) instead of inlining, which
// represents the possibly-cyclic planner graph. plans[0] is the root log-type plan.
message RedactionPlanSet {
  // Plans in index order; referenced by index elsewhere.
  repeated MessageRedactionPlan plans = 1;
}

// Redaction plan for one proto message type (1:1 with MessagePlan).
message MessageRedactionPlan {
  // FQ proto name of the redacted message. Debug/trace only; not unique, so never key on it.
  optional string message_full_name = 1;

  // Per-field actions; a field number absent here is dropped (allowlist default).
  repeated FieldActionEntry actions = 2;

  // Attribution field numbers for per-tenant gating; each unset if the message lacks that field.
  optional int32 workspace_id_field_number = 3;
  optional int32 account_id_field_number = 4;
  optional int32 metastore_id_field_number = 5;

  // Key-shape gate for a synthetic map-entry plan: under enforcement, the key (this field) must
  // match one of `key_shapes` or the whole entry is dropped (a bad key can't be wiped to "" without
  // colliding entries onto one key). Unset = no gate; set with empty `key_shapes` = drop every entry
  // under enforcement. NB: this is the INVERSE of PassThroughString.allowed_shapes, where empty means
  // "no constraint" (keep) — an empty key-shape gate means "drop all".
  optional int32 key_shape_field_number = 6;
  repeated compliance.DataShape key_shapes = 7;
}

// One (field number -> action) pair; a repeated list replaces map<int32, FieldAction> (awkward in Rust).
message FieldActionEntry {
  // Field number within the message this plan redacts.
  optional int32 field_number = 1;
  // How to handle the field.
  optional FieldAction action = 2;
}

// How to handle one field (1:1 with FieldAction opcodes). Exactly one arm is set; unset/unknown
// means fail closed.
message FieldAction {
  oneof action {
    // Copy the field's bytes verbatim.
    PassThrough pass_through = 1;
    // Drop the field.
    Remove remove = 2;
    // Redact a nested message with another plan in the table.
    Recurse recurse = 3;
    // Keep/drop a json_map field per-entry by key centralizability.
    MapEntry map_entry = 4;
    // Keep the map key, strip the value.
    MapStripValue map_strip_value = 5;
    // Keep a tagged value only if its runtime label is centralizable.
    RedactTag redact_tag = 6;
    // Centralizable string; enforces shape constraints via allowed_shapes.
    PassThroughString pass_through_string = 7;
    // Derive this field's value from a sibling source field via a transform (Phase 1: HMAC hash).
    RedactFrom redact_from = 8;
    // (-- GenericAny (9) stays deferred: it needs Any type resolution the executor lacks. --)
    // Re-emit the field as a zero-length string (blank the value, keep presence).
    EmptyString empty_string = 10;
    // Drop the field (planner fail-safe for an unresolvable redaction).
    TodoRemove todo_remove = 11;
  }
}

// Copy the field's bytes verbatim (centralizable field).
message PassThrough {}

// Drop the field.
message Remove {}

// Centralizable string; enforces shape constraints via allowed_shapes. Behavior depends on the
// per-record ShapeEnforcement verdict passed to the executor (Off for Governator, On for the LP
// write path):
//   - Enforcement Off: always copies the field verbatim, regardless of allowed_shapes.
//   - Enforcement On + non-empty allowed_shapes: keeps the field iff its value matches ANY listed
//     shape (union), else drops it.
//   - Enforcement On + empty allowed_shapes: DROPS the field (a centralizable string declaring no
//     shape is wiped under the gate) — NOT a passthrough.
message PassThroughString {
  // Allowed shapes for this string field. Union semantics under enforcement (see the message
  // comment): matches ANY => kept. Empty means "declares no shape" — verbatim when enforcement is
  // Off, dropped when enforcement is On.
  repeated compliance.DataShape allowed_shapes = 1;
}

// Derive this field's value from a sibling source field's cleartext via a transform (1:1 with the
// planner's REDACT_FROM opcode). Execution is a two-pass walk: Pass 1 collects the source value (it
// may appear after the target in wire order), Pass 2 emits the derived value. Phase 1 implements only
// HMAC_HASH; any other transform fails closed at serialization.
message RedactFrom {
  // Field number of the cleartext source field on the same message. A self-hash (a field that hashes
  // its own value in place) points this at its own field number.
  optional int32 source_field_number = 1;

  // Derivation to apply to the collected source value. Phase 1 implements only HMAC_HASH.
  optional RedactFromTransform transform = 2;

  // Shape enforcement for the derived value (the planner's @Nullable DataShapeValidator[]). Absent =
  // no enforcement (a non-centralizable self-hash); present = a centralizable target, kept under the
  // runtime gate iff it matches one of `shapes` (an empty `shapes` wipes it). The wrapper gives the
  // arm presence, keeping absent distinct from present-but-empty.
  optional DerivedShapes derived_shapes = 3;

  // True when the target (this) field is repeated: emit one derived value per collected source
  // occurrence; false emits a single value from the last source occurrence.
  // (-- named is_repeated, not `repeated`, which is a protobuf keyword and cannot be a field name. --)
  optional bool is_repeated = 4;

  // Wrapper giving `derived_shapes` message presence (see the field comment above).
  message DerivedShapes {
    // (compliance.data_shape) annotations to enforce on the derived value; an empty list means the
    // target is centralizable but declares no shape, so it is wiped under the gate.
    repeated compliance.DataShape shapes = 1;
  }
}

// Transform applied to a RedactFrom source value (a subset of the planner's RedactFromTransform:
// only the transforms the executor implements are enumerated). Phase 1 implements HMAC_HASH only.
enum RedactFromTransform {
  // Default when the transform is unset or unrecognized. A serialized plan must never carry this
  // value; the executor treats it as a coverage gap and fails closed.
  REDACT_FROM_TRANSFORM_UNSPECIFIED = 0;
  // HMAC-SHA-512 the source value with the fleet hashing key, in the legacy signed-decimal encoding.
  REDACT_FROM_TRANSFORM_HMAC_HASH = 1;
}

// Re-emit the field as a zero-length string (tag + 0-length prefix): blanks the value while keeping
// the field present. 1:1 with the planner's EMPTY_STRING opcode (custom_redactor = EMPTY).
message EmptyString {}

// Drop the field, exactly like Remove. The planner's fail-safe fallback for a field whose redaction
// couldn't be resolved. 1:1 with the planner's TODO_REMOVE opcode; the description is carried for
// debugging/round-trip fidelity but does not affect redaction.
message TodoRemove {
  // Why the field's redaction couldn't be resolved. Debug/trace only; never gates redaction.
  optional string description = 1;
}

// map<K, V> with a centralizable key but non-centralizable value: keep the key, strip the value.
message MapStripValue {}

// Redact a nested message with one of the plans in the table.
message Recurse {
  // Index into RedactionPlanSet.plans. Must be set and < plans size; the Rust loader bounds-checks
  // and fails closed. May reference an ancestor (how cyclic message types are expressed).
  // (-- int32 not uint32: the proto linter disallows unsigned scalars. --)
  optional int32 child_plan_index = 1;
}

// A databricks.json_map field, kept or dropped per entry by key centralizability. The default
// applies to keys not in `key_decisions`; each entry overrides one key, in either direction. E.g.
// "keep all but secret_token" = default true + {secret_token: false}; "drop all but tenant_id" is
// the mirror.
message MapEntry {
  // Field number of the entry's `key` field.
  optional int32 key_field_number = 1;

  // Applied to keys not in `key_decisions`. true = keep, false = drop.
  optional bool default_is_centralizable = 2;

  // Per-key overrides; unlisted keys use the default. Keys are pre-lower-cased by the planner.
  repeated MapKeyDecision key_decisions = 3;
}

// Overrides the map default for one key.
message MapKeyDecision {
  // The (lower-cased) map key this decision applies to.
  optional string key = 1;
  // Always set by the producer: true = keep this key, false = drop it.
  optional bool is_centralizable = 2;
}

// A logging.Field tagged value: keep its value only if its runtime label is in this set.
message RedactTag {
  // Labels whose tagged values are kept; others are dropped. The Rust executor compares each
  // DataLabel's enum number against the raw varint label on the wire.
  repeated compliance.DataLabel keepable_labels = 1;
}
