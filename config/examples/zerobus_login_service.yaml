# Example config for the databricks_zerobus sink with login_service auth, as used by
# vector-aggregator-metrics (VAM) to append pod metrics to main.eng_hydra.pod_prime_raw.
#
# Vector mints two principal contexts from Login via mTLS, each by requesting a named
# operation from the VAM SSP policy (VectorAggregatorMetricsAuthzPolicy in universe):
# `ucread` for the Unity Catalog schema fetch and `zerobuswrite` for Zerobus ingestion.
# The sink's `table_name` is sent as the policy's `tableFullName` binding.
#
# Replace the ${...} placeholders with the target region's values. The SSP is only issued
# for the allowlisted logfood accounts.

sources:
  demo_pod_metrics:
    type: demo_logs
    format: shuffle
    lines:
      - '{"name":"example_metric","value":1}'
    sequence: true
    interval_secs: 5

sinks:
  zerobus:
    type: databricks_zerobus
    inputs: [demo_pod_metrics]
    table_name: main.eng_hydra.pod_prime_raw
    ingestion_endpoint: "${ZEROBUS_INGESTION_ENDPOINT}"
    # Optional: override ingestion SNI and the certificate DNS name checked by the SDK.
    # ingestion_domain_name: "regional-dp-apiproxy.service"
    unity_catalog_endpoint: "${UNITY_CATALOG_ENDPOINT}"

    schema:
      type: unity_catalog

    batch_encoding:
      codec: arrow_stream

    auth:
      strategy: login_service
      # Per-customer identity used when minting the principal context (UserAuthInfo).
      user:
        workspace_id: ${WORKSPACE_ID}
        service_principal_resource: "accounts/${ACCOUNT_ID}/vector-aggregator-metrics"
        # service_principal_type defaults to SYSTEM (3); override only if needed.
        # Policy operations Login resolves into UC permissions; these are the defaults.
        uc_read_operation: ucread
        zerobus_write_operation: zerobuswrite
      # Shared by Login, internal Unity Catalog, and Zerobus ingestion.
      tls:
        crt_file: "/databricks-infra/dbts2/creds.combined.pem"
        key_file: "/databricks-infra/dbts2/creds.combined.pem"
        # Trust bundle must include the shard-services CA for internal E/W endpoints.
        ca_file: "/databricks-infra/dbts2/creds.cert.pem"
        # Applies to Login and UC only; Zerobus always verifies its server name.
        verify_hostname: false
      login_service:
        login_endpoint: "${LOGIN_ENDPOINT}"
        login_server_name: "${LOGIN_SERVER_NAME}"
        # FileDescriptorSet covering Login's PrincipalContextService. Built once from
        # universe protos (common/principal-context/api/proto/service.proto, with
        # --include_imports) and mounted into the container.
        proto_descriptor_path: "/etc/vector/principal_context_service.pb"
      unity_catalog:
        proto_descriptor_path: "/etc/vector/managed_catalog_service.pb"
      # Metastore the signed principal context is bound to.
      metastore_id: ${METASTORE_ID}
      # SSP resource path Zerobus accepts the signed context for.
      # Defaults to workspaces/<workspace_id>/zerobusDirectWriteApi.
      # zerobus_ssp_resource_path: "workspaces/<workspace_id>/zerobusDirectWriteApi"
